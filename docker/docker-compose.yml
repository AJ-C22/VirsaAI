version: "3.9"

services:
  db:
    image: postgres:16
    container_name: virsaai_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: visra
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: virsaai_api
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: visra
      PYTHONUNBUFFERED: "1"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ../backend:/app
      - ../backend/uploads:/app/uploads
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

volumes:
  pgdata:
